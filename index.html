<!DOCTYPE html>
<html>
  <head>
    <title>Arcanum Obscura</title>
    <style>
      body {
        background-image: url('Insta1.png');
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-position: center;
        color: #f8f8f2;
        font-family: 'Georgia', serif;
        position: relative;
        z-index: 0;
        margin: 0;
        padding: 0;
      }

      /* Centered content container */
      .content {
        max-width: 700px;
        margin: 0 auto;
        padding: 40px 20px;
        text-align: center;
        position: relative;
        z-index: 2;
      }

      /* ⭐ Cinematic Header Styling */
      h1 {
        font-size: 3.2rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 20px;
        color: #e8e6d8;

        /* Arcane teal glow */
        text-shadow:
          0 0 8px rgba(0, 255, 255, 0.25),
          0 0 16px rgba(0, 255, 255, 0.15),

          /* Brass depth shadow */
          2px 2px 4px rgba(60, 40, 20, 0.6);
      }

      /* Fog layer behind text */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle at top left, rgba(255,255,255,0.05), transparent 60%),
                    radial-gradient(circle at bottom right, rgba(255,255,255,0.05), transparent 60%);
        animation: fogShift 60s linear infinite;
        pointer-events: none;
        z-index: -1;
        filter: blur(30px);
        opacity: 0.4;
      }

      @keyframes fogShift {
        0%   { transform: translate(0, 0) rotate(0deg); }
        50%  { transform: translate(-25%, -10%) rotate(180deg); }
        100% { transform: translate(0, 0) rotate(360deg); }
      }

      a {
        color: #9be7ff;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="content">
      <h1>Arcanum Obscura</h1>

      <h2>The Everdream — Now Live</h2>
      <p><a href="YOUR_BOOK_2_LINK">Read Book 2</a></p>

      <h2>Links</h2>
      <p><a href="/links.html">All Links</a></p>
    </div>
  </body>
</html>
