<!DOCTYPE html>
<html>
  <head>
    <title>Arcanum Obscura</title>
    <style>
      body {
        background-image: url('Insta1.png');
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-position: center;
        color: #f8f8f2;
        font-family: 'Georgia', serif;
        position: relative;
        z-index: 0;
        margin: 0;
        padding: 0;
      }

      /* Centered content container */
      .content {
        max-width: 700px;
        margin: 0 auto;
        padding: 40px 20px;
        text-align: center;
        position: relative;
        z-index: 2;
      }

      /* ⭐ Cinematic Header Styling */
      h1 {
        font-size: 3.2rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 10px;
        color: #e8e6d8;
        text-shadow:
          0 0 8px rgba(0, 255, 255, 0.25),
          0 0 16px rgba(0, 255, 255, 0.15),
          2px 2px 4px rgba(60, 40, 20, 0.6);
      }

      /* ⭐ Teal Header Divider */
      .header-divider {
        width: 180px;
        height: 3px;
        margin: 0 auto 30px auto;
        background: linear-gradient(
          to right,
          rgba(0, 255, 255, 0) 0%,
          rgba(0, 255, 255, 0.7) 50%,
          rgba(0, 255, 255, 0) 100%
        );
        box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
        border-radius: 2px;
      }

      /* ⭐ Glowing Button Styling */
      .glow-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 22px;
        margin: 10px 0;
        background: rgba(0, 40, 40, 0.6);
        border: 1px solid rgba(0, 255, 255, 0.4);
        border-radius: 6px;
        color: #9be7ff;
        font-size: 1.1rem;
        text-decoration: none;
        text-shadow: 0 0 6px rgba(0, 255, 255, 0.4);
        box-shadow: 0 0 12px rgba(0, 255, 255, 0.25);
        transition: 0.25s ease;
      }

      .glow-button:hover {
        background: rgba(0, 60, 60, 0.8);
        box-shadow: 0 0 18px rgba(0, 255, 255, 0.45);
        transform: translateY(-2px);
      }

      /* ⭐ Discord Icon */
      .discord-icon {
        width: 22px;
        height: 22px;
        filter: drop-shadow(0 0 4px rgba(0, 255, 255, 0.6));
      }

      /* Fog layer behind text */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle at top left, rgba(255,255,255,0.05), transparent 60%),
                    radial-gradient(circle at bottom right, rgba(255,255,255,0.05), transparent 60%);
        animation: fogShift 60s linear infinite;
        pointer-events: none;
        z-index: -1;
        filter: blur(30px);
        opacity: 0.4;
      }

      @keyframes fogShift {
        0%   { transform: translate(0, 0) rotate(0deg); }
        50%  { transform: translate(-25%, -10%) rotate(180deg); }
        100% { transform: translate(0, 0) rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div class="content">
      <h1>Arcanum Obscura</h1>
      <div class="header-divider"></div>

      <h2>The Everdream — Now Live</h2>
      <a class="glow-button" href="YOUR_BOOK_2_LINK">Read Book 2</a>

      <h2>Start the Series</h2>
      <a class="glow-button" href="https://www.amazon.com/dp/B0FH1D5DXN">Read Book 1</a>

      <h2>About the Author</h2>
      <p>Fantasy author. Worldbuilder. Mythic architect. Creator of the Arcanum Obscura series.</p>

      <h2>Join the Discord</h2>
      <a class="glow-button" href="https://discord.gg/BXTTQbMJ">
        <img class="discord-icon" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f5e3.svg" alt="Discord">
        Enter the community
      </a>

      <h2>Links</h2>
      <p><a href="/links.html">All Links</a></p>
    </div>
  </body>
</html>
